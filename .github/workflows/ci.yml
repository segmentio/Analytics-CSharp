name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Tests target net10.0 and net6.0, so both runtimes are needed to
          # execute them; the 10 SDK alone only covers the former.
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Configure Artifactory NuGet source
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@c94e420aa64ea686ff25bb03d4c66cdaf8e523e4 # main
        with:
          ecosystem: dotnet
          provider-name: github-actions-segmentio

      # Scoped to the library and its tests via the solution filter. The sample
      # projects in the .sln include legacy msbuild Xamarin and Unity ones, which
      # dotnet cannot restore or build on a Linux runner at all.
      - name: Restore dependencies
        run: dotnet restore Analytics-CSharp.slnf --locked-mode

      - name: Build
        run: dotnet build Analytics-CSharp.slnf --no-restore

      - name: Test
        run: dotnet test Analytics-CSharp.slnf --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
